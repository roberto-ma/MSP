apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mdmq-servicios-web
  title: "Servicios Web MDMQ"
  description: |
    Conjunto de servicios web SOAP del Municipio del Distrito Metropolitano de Quito
    para consulta de personas y proveedores de telefonía.
    
    **APIs disponibles:**
    - 🔍 Consulta de Personas
    - 📞 Proveedores de Telefonía
  tags:
    - soap
    - mdmq
    - gobierno
    - servicios-web
  links:
    - url: https://www.quito.gob.ec
      title: Portal Oficial MDMQ
      icon: web
    - url: https://pam.quito.gob.ec/MDMQ_WS_Personas2012/Presentacion/PersonaSQL.asmx?wsdl
      title: WSDL Principal
      icon: docs
spec:
  type: service
  lifecycle: production
  owner: user:guest
  providesApis:
    - soap-personas
    - soap-proveedores-telefonia
