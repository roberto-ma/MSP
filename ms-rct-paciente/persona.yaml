apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mdmq-personas-soap
  description: Servicio SOAP para buscar persona completa en MDMQ Quito
  owner: equipo-qa               # <-- Owner aquí en metadata
  tags:
    - soap
    - mdmq
spec:
  type: soap
  lifecycle: production
  definition: |
    <?xml version="1.0" encoding="utf-8"?>
    <definitions xmlns="http://schemas.xmlsoap.org/wsdl/"
                 xmlns:soap="http://schemas.xmlsoap.org/wsdl/soap/"
                 xmlns:xs="http://www.w3.org/2001/XMLSchema"
                 targetNamespace="http://mdmq.quito.gob.ec/"
                 xmlns:tns="http://mdmq.quito.gob.ec/">

      <types>
        <xs:schema targetNamespace="http://mdmq.quito.gob.ec/">
          <xs:element name="fn_consulta_buscarPersonaCompleto">
            <xs:complexType>
              <xs:sequence>
                <xs:element name="strIdentificacion" type="xs:string" />
                <xs:element name="strTipoIdentificacion" type="xs:string" />
                <xs:element name="strAccion" type="xs:string" />
              </xs:sequence>
            </xs:complexType>
          </xs:element>
          <xs:element name="fn_consulta_buscarPersonaCompletoResponse">
            <xs:complexType>
              <xs:sequence>
                <xs:element name="fn_consulta_buscarPersonaCompletoResult" type="xs:int" />
                <xs:element name="strMensaje" type="xs:string" />
                <xs:element name="perPersona">
                  <xs:complexType>
                    <xs:sequence>
                      <xs:element name="PE_PERSONA_ID" type="xs:long" />
                      <xs:element name="PE_DENOMINACION" type="xs:string" />
                      <xs:element name="PE_NOMBRES" type="xs:string" />
                      <xs:element name="PE_APELLIDOS" type="xs:string" />
                      <xs:element name="PE_RAZON_SOCIAL" type="xs:string" />
                      <xs:element name="PE_NUM_IDENTIFICACION" type="xs:string" />
                      <xs:element name="PE_TIP_IDENTIFICACION" type="xs:string" />
                      <xs:element name="PE_TIP_PERSONA" type="xs:string" />
                      <xs:element name="PE_MAIL" type="xs:string" />
                      <xs:element name="PE_ESTADO_TRAN" type="xs:string" />
                      <xs:element name="PE_ESTADO_DESC" type="xs:string" />
                      <xs:element name="PE_FECHA_NACIMIENTO" type="xs:dateTime" />
                      <xs:element name="PE_FECHA_FALLECIMIENTO" type="xs:dateTime" minOccurs="0" />
                      <xs:element name="PE_FECH_INSC_FALLECIMIENTO" type="xs:dateTime" minOccurs="0" />
                      <xs:element name="PE_ESTADO_CIVIL" type="xs:string" />
                      <xs:element name="PE_CEDULA_CONYUGE" type="xs:string" />
                      <xs:element name="PE_NOMBRE_CONYUGE" type="xs:string" />
                      <xs:element name="PE_NACIONALIDAD" type="xs:string" />
                      <xs:element name="PE_CELULAR" type="xs:string" />
                      <xs:element name="PE_TELEFONO" type="xs:string" />
                    </xs:sequence>
                  </xs:complexType>
                </xs:element>
              </xs:sequence>
            </xs:complexType>
          </xs:element>
        </xs:schema>
      </types>

      <message name="fn_consulta_buscarPersonaCompletoRequest">
        <part name="parameters" element="tns:fn_consulta_buscarPersonaCompleto" />
      </message>
      <message name="fn_consulta_buscarPersonaCompletoResponse">
        <part name="parameters" element="tns:fn_consulta_buscarPersonaCompletoResponse" />
      </message>

      <portType name="PersonaSQLPortType">
        <operation name="fn_consulta_buscarPersonaCompleto">
          <input message="tns:fn_consulta_buscarPersonaCompletoRequest" />
          <output message="tns:fn_consulta_buscarPersonaCompletoResponse" />
        </operation>
      </portType>

      <binding name="PersonaSQLBinding" type="tns:PersonaSQLPortType">
        <soap:binding style="document" transport="http://schemas.xmlsoap.org/soap/http" />
        <operation name="fn_consulta_buscarPersonaCompleto">
          <soap:operation soapAction="http://mdmq.quito.gob.ec/fn_consulta_buscarPersonaCompleto" />
          <input>
            <soap:body use="literal" />
          </input>
          <output>
            <soap:body use="literal" />
          </output>
        </operation>
      </binding>

      <service name="PersonaSQLService">
        <port name="PersonaSQLPort" binding="tns:PersonaSQLBinding">
          <soap:address location="https://pam.quito.gob.ec/MDMQ_WS_Personas2012/Presentacion/PersonaSQL.asmx" />
        </port>
      </service>
    </definitions>
