openapi: 3.0.3
info:
  title: MDMQ Personas SOAP API
  version: 1.0.0
  description: API SOAP para consultar personas y proveedores telefónicos en MDMQ Quito
servers:
  - url: https://pam.quito.gob.ec/MDMQ_WS_Personas2012/Presentacion/PersonaSQL.asmx
paths:
  /:
    post:
      summary: fn_consulta_buscarPersonaCompleto
      operationId: buscarPersonaCompleto
      requestBody:
        description: SOAP request para buscar persona completa
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <?xml version="1.0" encoding="utf-8"?>
                <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
                  <soap:Header>
                    <Cabecera xmlns="http://mdmq.quito.gob.ec/">
                      <UserName>string</UserName>
                      <Password>string</Password>
                    </Cabecera>
                  </soap:Header>
                  <soap:Body>
                    <fn_consulta_buscarPersonaCompleto xmlns="http://mdmq.quito.gob.ec/">
                      <strIdentificacion>string</strIdentificacion>
                      <strTipoIdentificacion>string</strTipoIdentificacion>
                      <strAccion>string</strAccion>
                    </fn_consulta_buscarPersonaCompleto>
                  </soap:Body>
                </soap:Envelope>
      responses:
        '200':
          description: Respuesta SOAP exitosa
          content:
            text/xml:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="utf-8"?>
                  <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
                    <soap:Body>
                      <fn_consulta_buscarPersonaCompletoResponse xmlns="http://mdmq.quito.gob.ec/">
                        <fn_consulta_buscarPersonaCompletoResult>int</fn_consulta_buscarPersonaCompletoResult>
                        <strMensaje>string</strMensaje>
                        <perPersona>
                          <PE_PERSONA_ID>long</PE_PERSONA_ID>
                          <PE_DENOMINACION>string</PE_DENOMINACION>
                          <!-- Más campos -->
                        </perPersona>
                      </fn_consulta_buscarPersonaCompletoResponse>
                    </soap:Body>
                  </soap:Envelope>
  /proveedor_telf:
    post:
      summary: fn_consulta_proveedor_telf
      operationId: proveedorTelf
      requestBody:
        description: SOAP request para consultar proveedores telefónicos
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <?xml version="1.0" encoding="utf-8"?>
                <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
                  <soap:Header>
                    <Cabecera xmlns="http://mdmq.quito.gob.ec/">
                      <UserName>string</UserName>
                      <Password>string</Password>
                    </Cabecera>
                  </soap:Header>
                  <soap:Body>
                    <fn_consulta_proveedor_telf xmlns="http://mdmq.quito.gob.ec/" />
                  </soap:Body>
                </soap:Envelope>
      responses:
        '200':
          description: Respuesta SOAP proveedores telefónicos exitosa
          content:
            text/xml:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="utf-8"?>
                  <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
                    <soap:Body>
                      <fn_consulta_proveedor_telfResponse xmlns="http://mdmq.quito.gob.ec/">
                        <fn_consulta_proveedor_telfResult>int</fn_consulta_proveedor_telfResult>
                        <strMensaje>string</strMensaje>
                        <lstPerProveedorTelf>
                          <clsPerProveedorTelf>
                            <PRV_ID>string</PRV_ID>
                            <PRV_DESCRIPCION>string</PRV_DESCRIPCION>
                          </clsPerProveedorTelf>
                        </lstPerProveedorTelf>
                      </fn_consulta_proveedor_telfResponse>
                    </soap:Body>
                  </soap:Envelope>
